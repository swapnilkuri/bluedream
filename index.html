<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blue Dream</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
  <!-- Font Awesome for Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-950 text-white relative font-sans">

  <!-- Native Hidden Audio Player Element -->
  <audio id="main-audio" preload="metadata"></audio>

  <!-- Background Overlay Image / Gradient -->
  <div class="absolute inset-0 bg-cover bg-center z-0 opacity-80" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/60 via-slate-950/30 to-slate-950/90"></div>
  </div>

  <!-- Top Status Bar -->
  <header class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-20 text-xs sm:text-sm font-medium tracking-wide">
    <div class="flex items-center space-x-2 bg-slate-900/60 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50">
      <span id="current-time">00:00 AM</span>
    </div>

    <!-- Center Badges -->
    <div class="flex items-center bg-slate-900/60 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50">
      <span class="inline-flex items-center text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-2"></span>
        <span id="live-counter">1 online</span>
      </span>
    </div>

    <!-- Right Utility Icons -->
    <div class="flex items-center space-x-3 bg-slate-900/60 backdrop-blur-md px-3 py-2 rounded-full border border-slate-700/50">
      <button id="fullscreen-btn" class="hover:text-cyan-400 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- Center Typography Title -->
  <main class="absolute inset-0 flex flex-col items-center justify-center z-10 text-center px-4">
    <h1 class="text-5xl sm:text-7xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-100 to-indigo-300 drop-shadow-lg">
      BLUE DREAM
    </h1>
    <p class="mt-4 text-slate-300 text-sm sm:text-base max-w-md font-light">
      Atmospheric relaxation, live vibes, and continuous soundwaves.
    </p>
  </main>

  <!-- Bottom Navigation & Controls Bar -->
  <footer class="absolute bottom-6 left-0 right-0 z-20 px-6 flex flex-col md:flex-row items-center justify-between gap-4">
    
    <!-- Bottom Left: Copyright Badge -->
    <div class="bg-slate-900/60 backdrop-blur-md border border-slate-700/50 px-5 py-2.5 rounded-2xl text-xs text-slate-300 font-medium tracking-wider shadow-lg">
      © 2026 Detx Gaming
    </div>

    <!-- Bottom Center: Audio Player Widget -->
    <div class="bg-slate-900/80 backdrop-blur-lg border border-slate-700/60 rounded-2xl p-3 sm:px-5 sm:py-3 flex items-center space-x-3 sm:space-x-4 shadow-2xl max-w-lg w-full">
      
      <!-- Track Icon -->
      <div class="w-10 h-10 rounded-lg bg-indigo-600/50 flex items-center justify-center text-cyan-300 shrink-0">
        <i class="fa-solid fa-music"></i>
      </div>

      <!-- Track Info -->
      <div class="flex-1 min-w-0">
        <h4 id="track-title" class="text-xs font-semibold text-slate-100 truncate">Loading...</h4>
        <p id="track-artist" class="text-[10px] text-slate-400 truncate">Loading...</p>
      </div>

      <!-- Playback Controls -->
      <div class="flex items-center space-x-1.5 shrink-0">
        <button id="prev-btn" class="w-8 h-8 rounded-full hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center transition">
          <i class="fa-solid fa-backward-step text-xs"></i>
        </button>

        <button id="play-btn" class="w-10 h-10 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center font-bold transition shadow-md">
          <i class="fa-solid fa-play ml-0.5"></i>
        </button>

        <button id="next-btn" class="w-8 h-8 rounded-full hover:bg-slate-800 text-slate-300 hover:text-white flex items-center justify-center transition">
          <i class="fa-solid fa-forward-step text-xs"></i>
        </button>
      </div>

      <!-- Volume Controls Divider & Slider -->
      <div class="hidden sm:flex items-center space-x-2 border-l border-slate-700/60 pl-3">
        <button id="volume-btn" class="text-slate-400 hover:text-cyan-300 transition text-sm">
          <i class="fa-solid fa-volume-high" id="volume-icon"></i>
        </button>
        <input type="range" id="volume-slider" min="0" max="1" step="0.01" value="0.8" 
               class="w-16 sm:w-20 accent-cyan-400 cursor-pointer h-1.5 bg-slate-700 rounded-lg">
      </div>

    </div>

    <!-- Bottom Right: Social Link Buttons -->
    <div class="flex items-center space-x-3">
      <a href="https://www.youtube.com/@detxislive" target="_blank" rel="noopener noreferrer" 
         class="bg-slate-900/60 backdrop-blur-md border border-slate-700/50 px-4 py-2.5 rounded-2xl text-xs text-slate-300 hover:text-red-400 hover:border-red-500/50 transition flex items-center space-x-2 font-medium shadow-lg">
        <i class="fa-brands fa-youtube text-red-500 text-sm"></i>
        <span>YouTube</span>
      </a>

      <a href="https://www.instagram.com/detxgaming/" target="_blank" rel="noopener noreferrer" 
         class="bg-slate-900/60 backdrop-blur-md border border-slate-700/50 px-4 py-2.5 rounded-2xl text-xs text-slate-300 hover:text-pink-400 hover:border-pink-500/50 transition flex items-center space-x-2 font-medium shadow-lg">
        <i class="fa-brands fa-instagram text-pink-500 text-sm"></i>
        <span>Instagram</span>
      </a>
    </div>

  </footer>

  <script src="script.js"></script>
</body>
</html>
