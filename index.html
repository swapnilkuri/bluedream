<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Blue Dream</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="styles.css" />
  <!-- Font Awesome for Player Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"/>
</head>
<body class="h-screen w-screen overflow-hidden bg-slate-950 text-white relative font-sans">

  <!-- Background Overlay Image / Gradient -->
  <div class="absolute inset-0 bg-cover bg-center z-0 opacity-80" style="background-image: url('https://images.unsplash.com/photo-1518709268805-4e9042af9f23?q=80&w=1920&auto=format&fit=crop');">
    <div class="absolute inset-0 bg-gradient-to-b from-slate-950/60 via-slate-950/30 to-slate-950/90"></div>
  </div>

  <!-- Top Status Bar -->
  <header class="absolute top-0 left-0 right-0 p-6 flex justify-between items-center z-20 text-xs sm:text-sm font-medium tracking-wide">
    <div class="flex items-center space-x-2 bg-slate-900/60 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50">
      <span id="current-time">00:00 AM</span>
    </div>

    <!-- Center Badges -->
    <div class="flex items-center space-x-3 bg-slate-900/60 backdrop-blur-md px-4 py-2 rounded-full border border-slate-700/50">
      <span class="inline-flex items-center text-emerald-400">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-pulse mr-2"></span>
        <span id="live-counter">1 online</span>
      </span>
      <span class="text-slate-500">|</span>
      <span id="countdown-timer" class="text-slate-300">Countdown loading...</span>
    </div>

    <!-- Right Utility Icons -->
    <div class="flex items-center space-x-3 bg-slate-900/60 backdrop-blur-md px-3 py-2 rounded-full border border-slate-700/50">
      <button id="fullscreen-btn" class="hover:text-cyan-400 transition" title="Toggle Fullscreen">
        <i class="fa-solid fa-expand"></i>
      </button>
    </div>
  </header>

  <!-- Center Typography Title -->
  <main class="absolute inset-0 flex flex-col items-center justify-center z-10 text-center px-4">
    <h1 class="text-5xl sm:text-7xl font-extrabold tracking-tight text-transparent bg-clip-text bg-gradient-to-r from-cyan-300 via-sky-100 to-indigo-300 drop-shadow-lg">
      BLUE DREAM
    </h1>
    <p class="mt-4 text-slate-300 text-sm sm:text-base max-w-md font-light">
      Atmospheric relaxation, live vibes, and continuous soundwaves.
    </p>
  </main>

  <!-- Bottom Floating Audio Player Widget -->
  <footer class="absolute bottom-6 left-0 right-0 flex justify-center z-20 px-4">
    <div class="bg-slate-900/80 backdrop-blur-lg border border-slate-700/60 rounded-2xl p-3 sm:px-6 sm:py-3 flex items-center space-x-4 shadow-2xl max-w-sm w-full">
      
      <!-- Track Thumbnail -->
      <div class="w-10 h-10 rounded-lg bg-indigo-600/50 flex items-center justify-center text-cyan-300 shrink-0">
        <i class="fa-solid fa-music"></i>
      </div>

      <!-- Track Info -->
      <div class="flex-1 min-w-0">
        <h4 id="track-title" class="text-xs font-semibold text-slate-100 truncate">Ambient Chill Radio</h4>
        <p id="track-artist" class="text-[10px] text-slate-400 truncate">Live Lofi Stream</p>
      </div>

      <!-- Playback Controls -->
      <button id="play-btn" class="w-10 h-10 rounded-full bg-cyan-500 hover:bg-cyan-400 text-slate-950 flex items-center justify-center font-bold transition shadow-md shrink-0">
        <i class="fa-solid fa-play ml-0.5"></i>
      </button>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
